name: wallet_core
description: Platform-neutral wallet state, services, models and translations shared by the Quantus apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

# Convention: see dependency placement section in ../melos.yaml.
# Shared dep versions must match the canonical list there.
#
# Only platform-neutral dependencies belong here. Mobile-only plugins
# (Firebase, local_auth, mobile_scanner, live activities, ...) stay in the
# app packages; test/architecture_test.dart enforces this.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  quantus_sdk:

  # Shared (canonical versions in melos.yaml)
  collection: ^1.19.1
  convert: ^3.1.2
  decimal: ^3.2.4
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5

  # State management
  flutter_riverpod: ^3.3.1

  # Utilities
  async: ^2.13.1
  clock: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.3

flutter:
  generate: true
