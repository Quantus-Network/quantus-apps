name: Create Wallet Android Build

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Which APKs to build"
        required: true
        default: "both"
        type: choice
        options:
          - mobile
          - cold
          - both
      build_mode:
        description: "Build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      create_release:
        description: "Create a public GitHub release for each built app (main only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wallet:
    name: ${{ matrix.app }} wallet
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(inputs.apps == 'both' && '["mobile","cold"]' || format('["{0}"]', inputs.apps)) }}
    uses: ./.github/workflows/build_wallet_apk.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      app: ${{ matrix.app }}
      build_mode: ${{ inputs.build_mode }}
      create_release: ${{ inputs.create_release }}
    secrets: inherit
