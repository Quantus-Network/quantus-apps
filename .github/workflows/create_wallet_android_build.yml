name: Create Wallet Android Build

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
      create_release:
        description: "Create a GitHub release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Melos
        run: melos bootstrap

      - name: Create .env file
        run: echo "${{ secrets.MOBILE_APP_ENV }}" > mobile-app/.env

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > mobile-app/android/app/google-services.json

      - name: Decode Android keystore
        if: inputs.build_mode == 'release'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > mobile-app/android/app/upload-keystore.jks

      - name: Create key.properties
        if: inputs.build_mode == 'release'
        run: |
          cat > mobile-app/android/key.properties << EOF
          storeFile=app/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build APK
        run: flutter build apk --${{ inputs.build_mode }}
        working-directory: ./mobile-app

      - name: Read version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' mobile-app/pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=wallet-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        id: rename_apk
        run: |
          MODE="${{ inputs.build_mode }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          SRC="mobile-app/build/app/outputs/flutter-apk/app-${MODE}.apk"
          DEST="mobile-app/build/app/outputs/flutter-apk/quantus_wallet_${VERSION}_${MODE}.apk"
          mv "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          echo "apk_name=quantus_wallet_${VERSION}_${MODE}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantus_wallet-android-${{ inputs.build_mode }}
          path: ${{ steps.rename_apk.outputs.apk_path }}

  create-release:
    name: Create Release
    if: ${{ inputs.create_release && inputs.build_mode == 'release' }}
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' mobile-app/pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=wallet-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: quantus_wallet-android-release
          path: ./artifacts

      - name: List downloaded artifacts
        run: find ./artifacts -type f | sort

      - name: Create and push git tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          echo "Tag to create: $TAG"

          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Error: Tag $TAG already exists on remote."
            echo "Please update the version in mobile-app/pubspec.yaml before creating a new release."
            exit 1
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          release_name: Quantus Wallet ${{ steps.get_version.outputs.version }}
          body: |
            ## Quantus Wallet - Android Release

            **Version:** ${{ steps.get_version.outputs.version }}

            ### Installation
            1. Download the `.apk` file below
            2. On your Android device, enable "Install from unknown sources" in Settings
            3. Open the downloaded APK to install

            ### What's Changed
            See commit history for details.

            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/quantus_wallet_${{ steps.get_version.outputs.version }}_release.apk
          asset_name: quantus_wallet_${{ steps.get_version.outputs.version }}.apk
          asset_content_type: application/vnd.android.package-archive
