name: Desktop App Build

# Builds the desktop wallet on every platform it ships on. A plugin or native
# change that breaks one platform builds fine on the others, so this is the
# only check that covers Windows and Linux.
on:
  workflow_dispatch: # Manual trigger
  pull_request:
    paths:
      - 'desktop-app/**'
      - 'desktop_qr_camera/**'
      - 'third_party/mobile_scanner/**'
      - '.github/workflows/desktop_app_build.yml'

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .fvmrc
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # The CocoaPods gem preinstalled on the macos-26 runner image is broken
      # (built against a different Ruby), so Flutter skips `pod install` and the
      # build aborts with "CocoaPods not installed or not in valid state".
      # Homebrew's CocoaPods ships with its own Ruby and takes PATH precedence.
      - name: Install working CocoaPods
        run: |
          brew install cocoapods || brew reinstall cocoapods
          pod --version

      # Fails if a package no longer matches the hash in the committed lockfile.
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./desktop-app

      - name: Build macOS debug
        run: flutter build macos --debug
        working-directory: ./desktop-app

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libstdc++-14-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # Fails if a package no longer matches the hash in the committed lockfile.
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./desktop-app

      # Every camera frame on Windows and Linux goes through this conversion,
      # and every Linux preview paint through the texture's buffer.
      - name: Check the camera frame conversion under the sanitizers
        working-directory: ./desktop_qr_camera
        run: |
          clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -I native test/native/yuy2_test.cpp -o "$RUNNER_TEMP/yuy2_test"
          "$RUNNER_TEMP/yuy2_test"
          clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -I linux test/native/camera_texture_buffer_test.cpp -o "$RUNNER_TEMP/camera_texture_buffer_test"
          "$RUNNER_TEMP/camera_texture_buffer_test"
          clang++ -std=c++17 -Wall -Wextra -Wno-unused-parameter -Werror -pthread \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined -I test/native/fake_flutter -I windows \
            test/native/texture_handler_test.cpp windows/texture_handler.cpp -o "$RUNNER_TEMP/texture_handler_test"
          "$RUNNER_TEMP/texture_handler_test"
          clang++ -std=c++14 -Wall -Wextra -Wno-unused-parameter -Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -I native test/native/windows_format_test.cpp -o "$RUNNER_TEMP/windows_format_test"
          "$RUNNER_TEMP/windows_format_test"
          clang++ -std=c++14 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -I test/native/fake_v4l2 -I native test/native/camera_linux_open_test.cpp \
            -o "$RUNNER_TEMP/camera_linux_open_test"
          "$RUNNER_TEMP/camera_linux_open_test"

      # The only run of the login password check against a real libpam. The
      # app's PAM service is installed as its package will install it, and the
      # runner's throwaway user is given a password to check.
      - name: Check a login password through PAM
        working-directory: ./desktop-app
        run: |
          sudo install -m 644 linux/packaging/pam.d/quantus-wallet /etc/pam.d/quantus-wallet
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "$(id -un):$password" | sudo chpasswd
          QUANTUS_PAM_TEST_PASSWORD="$password" flutter test tool/pam_login_password_test.dart

      - name: Build Linux debug
        run: flutter build linux --debug
        working-directory: ./desktop-app

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: .fvmrc
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      # Fails if a package no longer matches the hash in the committed lockfile.
      - name: Get dependencies
        run: flutter pub get --enforce-lockfile
        working-directory: ./desktop-app

      - name: Build Windows debug
        run: flutter build windows --debug
        working-directory: ./desktop-app
