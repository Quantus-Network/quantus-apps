name: desktop_qr_camera
description: Reads a computer's camera on Windows and Linux so that a QR code can be scanned.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: DesktopQrCameraPlugin
      windows:
        pluginClass: DesktopQrCameraPluginCApi
