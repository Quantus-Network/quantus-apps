<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steelman spike</title>
  <style>
    :root { --border: #e4e7ec; --muted: #667085; --accent: #2563eb; --green: #16a34a; }
    body {
      font: 15px/1.55 system-ui, -apple-system, sans-serif; color: #1f2937;
      max-width: 880px; margin: 40px auto; padding: 0 20px;
    }
    h1 { font-size: 20px; } h1 small { font-weight: 400; color: var(--muted); font-size: 13px; }
    .card { border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], textarea, select {
      width: 100%; box-sizing: border-box; border: 1px solid #d0d5dd; border-radius: 8px;
      padding: 8px 11px; font: inherit; background: #fff;
    }
    textarea { resize: vertical; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 9px 16px; font: inherit; cursor: pointer; margin-top: 12px;
    }
    button.secondary { background: #fff; color: #344054; border: 1px solid #d0d5dd; }
    button.accept { background: var(--green); }
    button:disabled { background: #98a2b3; cursor: not-allowed; }
    .seeds button { margin: 4px 6px 0 0; font-size: 12px; padding: 5px 10px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .pane { border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .pane h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .pane .text { white-space: pre-wrap; }
    .pane.draft { border-color: var(--accent); }
    .notes { font-size: 13px; color: var(--muted); white-space: pre-wrap; margin-top: 10px; }
    .question { margin-top: 10px; padding: 10px 12px; background: #fffaeb; border: 1px solid #fedf89; border-radius: 8px; font-size: 14px; }
    .roundtag { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 99px; padding: 2px 10px; margin-left: 8px; vertical-align: middle; }
    .published { border-color: var(--green); background: #f6fef9; }
    details { margin-top: 10px; } summary { cursor: pointer; font-size: 13px; color: var(--muted); }
    .error { color: #dc2626; font-size: 14px; margin-top: 10px; white-space: pre-wrap; }
    .spinner { color: var(--muted); font-size: 14px; margin-top: 12px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .claim-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .claim-card {
      border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
      background: #fafafa;
    }
    .claim-card h4 { margin: 0 0 6px; font-size: 13px; color: #344054; }
    .claim-card .steelman { font-size: 14px; white-space: pre-wrap; }
    .claim-card .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .claim-card .actions button { margin-top: 0; font-size: 13px; padding: 6px 12px; }
    .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

    /* tree view */
    #tree-panel h2 { font-size: 15px; margin: 0 0 4px; }
    #tree-panel .q { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .tree, .tree ul { list-style: none; margin: 0; padding: 0; }
    .tree ul { margin-left: 18px; border-left: 2px solid var(--border); padding-left: 14px; }
    .node { margin-top: 10px; }
    .node-body {
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: #fff;
    }
    .node-body.pro { border-left: 4px solid var(--green); }
    .node-body.con { border-left: 4px solid #dc2626; }
    .node-body.answer { border-left: 4px solid var(--accent); background: #f8faff; }
    .node .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .kind-badge {
      font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 700;
      padding: 1px 8px; border-radius: 99px;
    }
    .kind-badge.pro { color: var(--green); background: #e7f8ee; }
    .kind-badge.con { color: #dc2626; background: #fdeaea; }
    .kind-badge.answer { color: var(--accent); background: #e8effe; }
    .node .who { font-size: 12px; color: var(--muted); }
    .node .ptext { white-space: pre-wrap; }
    .node .node-actions { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .node .node-actions button { margin-top: 0; font-size: 12px; padding: 4px 10px; }
    .vote { display: inline-flex; align-items: center; gap: 4px; }
    .vote button { background: #fff; color: #344054; border: 1px solid #d0d5dd; padding: 2px 9px; }
    .vote .score { font-weight: 700; min-width: 18px; text-align: center; }
    .empty { color: var(--muted); font-size: 14px; }
    .replying-to {
      margin-top: 8px; padding: 8px 12px; background: #eff6ff; border: 1px solid #bfdbfe;
      border-radius: 8px; font-size: 13px; display: none;
    }
    .replying-to.show { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .replying-to button { margin-top: 0; font-size: 12px; padding: 3px 9px; }
  </style>
</head>
<body>
  <h1>Debate Tree <small>— AI-moderated argument map (spike)</small></h1>

  <div class="card" id="tree-panel">
    <h2>The tree</h2>
    <div class="q" id="tree-question"></div>
    <div id="tree-body"><div class="empty">Loading…</div></div>
  </div>

  <div class="card" id="setup">
    <div class="replying-to" id="replying-to"></div>
    <div class="seeds" id="seeds">
      <label>Try a real contentious argument:</label>
    </div>

    <label for="question">Debate question</label>
    <input type="text" id="question"
      value="Should TLS 1.3 standardize pure ML-KEM key agreement, or require hybrid (ECC+PQ)?">

    <label for="parent">Claim being responded to (optional)</label>
    <input type="text" id="parent" placeholder="e.g. a pro/con this argument replies to">

    <label for="stance">Stance</label>
    <select id="stance">
      <option value="supporting (pro)">supporting (pro)</option>
      <option value="opposing (con)">opposing (con)</option>
    </select>

    <label for="original">Your argument, in your own words</label>
    <textarea id="original" rows="6" placeholder="Type it the way you'd actually say it — heat and all."></textarea>

    <button id="start">Steelman it</button>
    <div class="error" id="setup-error"></div>
  </div>

  <div id="loop"></div>

  <script>
    const MAX_ROUNDS = 3;

    const SEEDS = [
      {
        label: "anti pure-PQ (heated)",
        stance: "opposing (con)",
        text: "Rolling out pure ML-KEM without a hybrid is absolutely insane. We have DECADES of cryptanalysis on ECC and like five minutes on lattices. SIKE got destroyed by a laptop over a weekend! Anyone pushing PQ-only either doesn't understand risk or is carrying water for the NSA. Hybrid costs basically nothing, refusing it is pure ideology.",
      },
      {
        label: "pro pure-PQ (compliance)",
        stance: "supporting (pro)",
        text: "People act like pure ML-KEM is reckless but the reality is CNSA 2.0 timelines require pure PQ by 2033 and vendors selling to the US government need a standards-track way to do it. If IETF refuses, those deployments happen anyway, just without any RFC quality control. Publishing the option with a 'hybrids preferred' note is strictly better than pretending the demand doesn't exist.",
      },
      {
        label: "emotionally loaded (moderation stress test)",
        stance: "opposing (con)",
        text: "The chairs just rammed this through, full stop. Two dozen people objected and they declared 'consensus' anyway because the big vendors wanted it. Why do we even pretend the process means anything?? This org is captured and everyone knows it, the mailing list is just theater.",
      },
    ];

    const seeds = document.getElementById("seeds");
    SEEDS.forEach((s) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "secondary"; b.textContent = s.label;
      b.onclick = () => {
        document.getElementById("original").value = s.text;
        document.getElementById("stance").value = s.stance;
      };
      seeds.appendChild(b);
    });

    const state = {
      question: "", parent: "", stance: "", original: "",
      rounds: [], draft: null, selectedClaim: null,
      parentId: null, parentLabel: "",
    };
    const loop = document.getElementById("loop");

    // ---- tree view -------------------------------------------------------
    async function loadTree() {
      const q = document.getElementById("question").value.trim();
      const res = await fetch("/api/tree?question=" + encodeURIComponent(q));
      const { space, nodes } = await res.json();
      document.getElementById("tree-question").textContent = space.question;
      renderTree(nodes);
    }

    function renderTree(nodes) {
      const body = document.getElementById("tree-body");
      if (!nodes.length) {
        body.innerHTML = '<div class="empty">No arguments yet — steelman one below to plant the first node.</div>';
        return;
      }
      const byParent = new Map();
      nodes.forEach((n) => {
        const k = n.parent_id || "root";
        if (!byParent.has(k)) byParent.set(k, []);
        byParent.get(k).push(n);
      });

      const build = (parentKey) => {
        const kids = byParent.get(parentKey) || [];
        if (!kids.length) return "";
        return "<ul>" + kids.map((n) => `
          <li class="node">
            <div class="node-body ${n.kind}">
              <div class="meta">
                <span class="kind-badge ${n.kind}">${n.kind}</span>
                <span class="who">${escapeHtml(n.author_account)}</span>
              </div>
              <div class="ptext">${escapeHtml(n.published_text)}</div>
              <div class="node-actions">
                <span class="vote">
                  <button data-vote="1" data-node="${n.id}">▲</button>
                  <span class="score">${n.score}</span>
                  <button data-vote="-1" data-node="${n.id}">▼</button>
                </span>
                <button class="secondary" data-reply="${n.id}" data-kind="${n.kind}">Reply</button>
                <button class="secondary" data-orig="${n.id}">Original</button>
              </div>
              <div class="ptext" id="orig-${n.id}" style="display:none;margin-top:8px;color:var(--muted);font-size:13px">${escapeHtml(n.original_text)}</div>
            </div>
            ${build(n.id)}
          </li>`).join("") + "</ul>";
      };

      body.innerHTML = '<ul class="tree">' + build("root").slice(4);
      body.querySelectorAll("[data-vote]").forEach((btn) => {
        btn.onclick = async () => {
          await fetch("/api/vote", {
            method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ nodeId: btn.dataset.node, value: Number(btn.dataset.vote) }),
          });
          loadTree();
        };
      });
      body.querySelectorAll("[data-orig]").forEach((btn) => {
        btn.onclick = () => {
          const el = document.getElementById("orig-" + btn.dataset.orig);
          el.style.display = el.style.display === "none" ? "block" : "none";
        };
      });
      body.querySelectorAll("[data-reply]").forEach((btn) => {
        btn.onclick = () => setReplyTarget(btn.dataset.reply, btn.dataset.kind);
      });
    }

    function setReplyTarget(nodeId, kind) {
      const node = document.querySelector(`[data-orig="${nodeId}"]`)
        ?.closest(".node-body")?.querySelector(".ptext")?.textContent || "";
      state.parentId = nodeId;
      state.parentLabel = node.slice(0, 80);
      const banner = document.getElementById("replying-to");
      banner.className = "replying-to show";
      banner.innerHTML = `<span>Replying to <em>${escapeHtml(state.parentLabel)}</em></span>
        <button class="secondary" id="clear-reply">Reply to question instead</button>`;
      document.getElementById("clear-reply").onclick = clearReplyTarget;
      document.getElementById("original").focus();
      document.getElementById("setup").scrollIntoView({ behavior: "smooth" });
    }

    function clearReplyTarget() {
      state.parentId = null;
      state.parentLabel = "";
      document.getElementById("replying-to").className = "replying-to";
    }

    loadTree();

    document.getElementById("start").onclick = async () => {
      state.question = document.getElementById("question").value.trim();
      state.parent = document.getElementById("parent").value.trim();
      state.stance = document.getElementById("stance").value;
      state.original = document.getElementById("original").value.trim();
      document.getElementById("setup-error").textContent = "";
      if (!state.original) {
        document.getElementById("setup-error").textContent = "Write an argument first.";
        return;
      }
      state.rounds = [];
      state.selectedClaim = null;
      await requestSteelman();
    };

    async function requestSteelman() {
      renderLoading();
      try {
        const res = await fetch("/api/steelman", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            question: state.question, parent: state.parent,
            stance: state.stance, original: state.original,
            rounds: state.rounds,
          }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || res.status);
        state.draft = body;
        if (state.selectedClaim) {
          const updated = body.claims.find((c) => c.id === state.selectedClaim.id) || body.claims[0];
          state.selectedClaim = updated;
        } else if (body.claims.length === 1) {
          state.selectedClaim = body.claims[0];
          renderRound();
        } else {
          renderClaimPicker();
        }
      } catch (err) {
        renderError(String(err.message || err));
      }
    }

    function renderLoading() {
      loop.innerHTML = '<div class="card"><div class="spinner">Moderator is disentangling and drafting…</div></div>';
    }

    function renderClaimPicker() {
      const d = state.draft;
      const claimsHtml = d.claims.map((c) => `
        <div class="claim-card">
          <h4>${escapeHtml(c.label)}</h4>
          <div class="steelman">${escapeHtml(c.steelman)}</div>
          <div class="actions">
            <button class="accept" data-accept="${escapeHtml(c.id)}">Accept this one</button>
            <button class="secondary" data-negotiate="${escapeHtml(c.id)}">Negotiate this one</button>
          </div>
        </div>`).join("");

      loop.innerHTML = `
        <div class="card">
          <strong>${d.claims.length} separate claims found</strong>
          <p class="hint">Each becomes its own tree node. Accept one as-is, or negotiate wording on one claim at a time.</p>
          <div class="claim-list">${claimsHtml}</div>
          ${d.notes ? `<div class="notes">${escapeHtml(d.notes)}</div>` : ""}
          ${d.question ? `<div class="question">Moderator asks: ${escapeHtml(d.question)}</div>` : ""}
        </div>`;

      d.claims.forEach((c) => {
        loop.querySelector(`[data-accept="${CSS.escape(c.id)}"]`).onclick = () => renderPublished(c.steelman, c);
        loop.querySelector(`[data-negotiate="${CSS.escape(c.id)}"]`).onclick = () => {
          state.selectedClaim = c;
          state.rounds = [];
          renderRound();
        };
      });
    }

    function renderRound() {
      const roundNo = state.rounds.length + 1;
      const isLast = roundNo >= MAX_ROUNDS;
      const d = state.draft;
      const claim = state.selectedClaim;

      loop.innerHTML = `
        <div class="card">
          <div class="row">
            <strong>Does this say what you mean?</strong>
            <span class="roundtag">${escapeHtml(claim.label)} · round ${roundNo} of ${MAX_ROUNDS}</span>
          </div>
          <div class="cols" style="margin-top:12px">
            <div class="pane"><h3>You wrote (full post)</h3><div class="text">${escapeHtml(state.original)}</div></div>
            <div class="pane draft"><h3>This claim</h3><div class="text">${escapeHtml(claim.steelman)}</div></div>
          </div>
          ${d.notes ? `<div class="notes">${escapeHtml(d.notes)}</div>` : ""}
          ${d.question ? `<div class="question">Moderator asks: ${escapeHtml(d.question)}</div>` : ""}

          <label for="feedback">What did it get wrong on this claim?</label>
          <textarea id="feedback" rows="3" placeholder="e.g. 'too soft on the SIKE point' or 'split the NSA jab into its own claim'"></textarea>

          <div class="row">
            <button class="accept" id="accept">Accept &amp; publish this claim</button>
            <button class="secondary" id="pushback" ${isLast ? "disabled" : ""}>
              ${isLast ? "No rounds left" : "Push back (revise)"}
            </button>
            <button class="secondary" id="back">Pick a different claim</button>
          </div>
        </div>`;

      document.getElementById("accept").onclick = () => renderPublished(claim.steelman, claim);
      document.getElementById("back").onclick = () => {
        state.selectedClaim = null;
        state.rounds = [];
        renderClaimPicker();
      };
      document.getElementById("pushback").onclick = async () => {
        const feedback = document.getElementById("feedback").value.trim();
        if (!feedback) { document.getElementById("feedback").focus(); return; }
        state.rounds.push({
          claimId: claim.id,
          claimLabel: claim.label,
          draft: claim.steelman,
          feedback,
        });
        await requestSteelman();
      };
    }

    function renderError(message) {
      loop.innerHTML = '<div class="card"><div class="error">' + escapeHtml(message) +
        '</div><button class="secondary" onclick="location.reload()">Start over</button></div>';
    }

    async function renderPublished(text, claim) {
      const claimLine = claim ? ` <span class="roundtag">${escapeHtml(claim.label)}</span>` : "";
      const transcript = {
        allClaims: state.draft?.claims, selectedClaim: claim || null, rounds: state.rounds,
      };
      loop.innerHTML = '<div class="card"><div class="spinner">Saving to the tree…</div></div>';

      let saveError = "";
      try {
        const res = await fetch("/api/publish", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({
            question: state.question, stance: state.stance,
            parentId: state.parentId, publishedText: text,
            originalText: state.original, transcript,
          }),
        });
        const b = await res.json();
        if (!res.ok) throw new Error(b.error || res.status);
      } catch (err) {
        saveError = String(err.message || err);
      }

      clearReplyTarget();
      await loadTree();

      loop.innerHTML = `
        <div class="card published">
          <strong>${saveError ? "Steelmanned — but save failed" : "Published to the tree (steelmanned, author-approved)"}${claimLine}</strong>
          ${saveError ? `<div class="error">${escapeHtml(saveError)}</div>` : ""}
          <div class="pane" style="margin-top:12px; background:#fff"><div class="text">${escapeHtml(text)}</div></div>
          <details><summary>Original text (always attached)</summary>
            <div class="text" style="margin-top:8px">${escapeHtml(state.original)}</div>
          </details>
          <div class="row">
            <button class="secondary" id="export">Copy transcript JSON</button>
            <button class="secondary" id="another">Add another argument</button>
          </div>
        </div>`;
      document.getElementById("export").onclick = () => {
        navigator.clipboard.writeText(JSON.stringify({
          question: state.question, parent: state.parent, stance: state.stance,
          original: state.original, allClaims: state.draft?.claims,
          selectedClaim: claim || null, rounds: state.rounds,
          published: text,
        }, null, 2));
      };
      document.getElementById("another").onclick = () => {
        state.rounds = []; state.selectedClaim = null; state.draft = null;
        document.getElementById("original").value = "";
        loop.innerHTML = "";
        document.getElementById("tree-panel").scrollIntoView({ behavior: "smooth" });
      };
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
</body>
</html>
