name: quantus_desktop_wallet
description: Quantus desktop wallet. Watch-only accounts signed by the cold wallet app over QR codes.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

# Convention: see dependency placement section in ../melos.yaml.
# Shared dep versions must match the canonical list there.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # quantus_sdk re-exports polkadart, qr_flutter etc. and ships the Riverpod
  # providers the apps share (quantus_sdk_riverpod.dart).
  quantus_sdk:

  # Shared (canonical versions in melos.yaml)
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  decimal: ^3.2.4
  collection: ^1.19.1

  # Desktop-only. Pinned to releases that clear the 30-day dependency cooldown;
  # camera_desktop 2.0.0, flutter_zxing 3.1.0 and url_launcher 6.3.3 are newer.
  camera: ^0.12.1
  camera_desktop: 1.2.1
  flutter_zxing: 3.0.1
  url_launcher: 6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/text/human_checkphrase_final_wordlist.txt
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Light.ttf
          weight: 300
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GeistMono-Bold.ttf
          weight: 700
