name: swap_live_activity_channel
description: Keeps the swap card method channel on every Android Flutter engine, including the FCM background isolate.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.quantus.wallet.swap_live_channel
        pluginClass: SwapLiveActivityPlugin
