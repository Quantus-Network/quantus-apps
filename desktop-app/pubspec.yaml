name: quantus_desktop_wallet
description: Quantus desktop wallet for macOS, Windows and Linux.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

# Convention: see dependency placement section in ../melos.yaml.
# Shared dep versions must match the canonical list there.
#
# Every Flutter plugin this app pulls in, directly or through another package,
# must support macOS, Windows and Linux; test/architecture_test.dart enforces
# this.
dependencies:
  flutter:
    sdk: flutter
  quantus_sdk:
  wallet_core:

  # State management
  flutter_riverpod: ^3.3.1

  # UI
  cupertino_icons: ^1.0.9

  # Time, so that tests can set it.
  clock: ^1.1.1
  # TelemetryDeck has no SDK for Windows or Linux: its HTTP API is called
  # directly. The hash of the user, a session's ID, and the request.
  crypto: ^3.0.7
  http: ^1.6.0
  uuid: ^4.6.0
  # Token logos come as SVG as often as not.
  flutter_svg: ^2.3.0

  # Platform
  # The camera on Windows and Linux: our own copy, see its README.
  desktop_qr_camera:
  ffi: ^2.2.0
  # The same version as the phone's.
  flutter_local_notifications: ^21.0.0
  local_auth: ^3.0.1
  # The camera on macOS. The same constraint as quantus_sdk's.
  mobile_scanner: ^7.2.0
  # Where what the push service holds of the Mac is kept, apart from the
  # wallet's preferences. The same constraint as quantus_sdk's.
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  # Reads QR codes from the camera on Windows and Linux. Exact: its QR path was
  # reviewed line by line at this version.
  zxing2: 0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The screenshot tool's in-memory preferences.
  shared_preferences: ^2.5.5
  yaml: ^3.1.3

dependency_overrides:
  # 7.2.0 with one patch, for this app only: see its PATCHES.md.
  mobile_scanner:
    path: ../third_party/mobile_scanner

flutter:
  uses-material-design: true
  assets:
    - assets/quantus_orange_logo.png
    # QTC's mark among the swap tokens, the phone's.
    - assets/token_qtc.svg
    # The words of the checkphrases, read from this app's bundle by
    # quantus_sdk's HumanReadableChecksumService. Without it every address
    # shows "Checkphrase unavailable"; test/checkphrase_word_list_test.dart
    # checks it is here.
    - assets/text/human_checkphrase_final_wordlist.txt

  # The families the theme (AppTextThemeV3) names, in the weights it uses. A
  # family missing here is drawn in the system font; test/fonts_test.dart
  # checks this list against the theme.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
