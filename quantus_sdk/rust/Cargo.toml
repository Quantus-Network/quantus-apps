[package]
name = "rust_lib_quantus_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# NOTE: Quantus chain dependencies.
qp-poseidon-core = "3.1.0"
# The Resonance-era (v0.9.x) Poseidon2 permutation used different round
# constants than the current one, so v09 airdrop addresses need the real crate.
qp-poseidon-core-v09 = { package = "qp-poseidon-core", version = "=0.9.5" }
qp-rusty-crystals-dilithium = { version = "4.1.1", default-features = false, features = ["ml-dsa-65", "ml-dsa-87"] }
qp-rusty-crystals-hdwallet = { version = "4.1.1", features = ["ml-dsa-65"] }
# The pre-March-2026 BIP32 tree ("Bitcoin seed" master HMAC key, soft child
# support): historical Dilithium accounts and wormhole entropies in
# api/airdrop.rs derive through it. Same crate qp-rusty-crystals-hdwallet
# < 2.1.0 used internally.
nam-tiny-hderive = { version = "=0.3.1-nam.1", default-features = false }

flutter_rust_bridge = "=2.12.0"
hex = "0.4.3"
sp-core = { version = "43.0.0", default-features = true }
parity-scale-codec = { version = "3.7.5", default-features = false, features = ["std"] }
sp-runtime = { version = "48.0.0", default-features = false, features = ["std"] }
quantus_ur = { git = "https://github.com/Quantus-Network/quantus_ur.git", tag = "1.6.0" }

# NEAR transactions (borsh wire format, base58 key text, SHA-256 signing hash,
# SHA3-256 access-key handle). Aligned with quantus-cli's near module.
borsh = { version = "1.5", features = ["derive"] }
bs58 = "0.5"
sha2 = "0.10"
sha3 = "0.10"

# ZK proof generation (aligned with quantus-cli / chain)
anyhow = "1.0"
blake3 = "1.8"
# Circuits from the unreleased qp-zk-circuits main: proof-of-burn leaf, exits
# and volume fee on the private batch (PRs #198-#202). The crates.io 4.4.0
# family is the previous (two exits per leaf) layout, which the chain this
# build targets no longer verifies. Switch every entry below to the published
# version once that release is cut.
#
# This rev still builds at production shape N=10. The chain's shape is N=9 /
# M=32 (qp-zk-circuits #210, rev dc68518), but that rev pins
# serde_json =1.0.154 while qp-rusty-crystals-hdwallet 4.1.1 pins =1.0.150,
# so Cargo cannot resolve both until one side relaxes its pin. The Dart
# planner already targets N=9 (wormholeDefaultLeafProofs).
qp-ownership-circuit = { git = "https://github.com/Quantus-Network/qp-zk-circuits.git", rev = "080bc897108e4aed3e315ccd9229bbbbcdb1c9f2", default-features = false, features = ["std"] }
qp-ownership-prover = { git = "https://github.com/Quantus-Network/qp-zk-circuits.git", rev = "080bc897108e4aed3e315ccd9229bbbbcdb1c9f2", default-features = false, features = ["std"] }
# Building blocks of qp-poseidon-core 0.9.5's hasher. The local v09 sponge in
# api/airdrop.rs hashes secret preimages from borrowed slices because the
# 0.9.5 crate's hash_no_pad consumes its Vec and frees it unscrubbed.
p3-field = { version = "0.3.0", default-features = false }
p3-goldilocks = { version = "0.3.0", default-features = false }
p3-symmetric = { version = "0.3.0", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
qp-plonky2 = { version = "=1.6.0", default-features = false, features = ["rand", "std"] }
qp-wormhole-circuit = { git = "https://github.com/Quantus-Network/qp-zk-circuits.git", rev = "080bc897108e4aed3e315ccd9229bbbbcdb1c9f2", default-features = false, features = ["std"] }
qp-wormhole-prover = { git = "https://github.com/Quantus-Network/qp-zk-circuits.git", rev = "080bc897108e4aed3e315ccd9229bbbbcdb1c9f2", default-features = false, features = ["std"] }
qp-wormhole-aggregator = { git = "https://github.com/Quantus-Network/qp-zk-circuits.git", rev = "080bc897108e4aed3e315ccd9229bbbbcdb1c9f2", default-features = false, features = ["std"] }
qp-wormhole-inputs = { git = "https://github.com/Quantus-Network/qp-zk-circuits.git", rev = "080bc897108e4aed3e315ccd9229bbbbcdb1c9f2", default-features = false, features = ["std"] }
qp-zk-circuits-common = { git = "https://github.com/Quantus-Network/qp-zk-circuits.git", rev = "080bc897108e4aed3e315ccd9229bbbbcdb1c9f2", default-features = false, features = ["std"] }
qp-wormhole-circuit-builder = { git = "https://github.com/Quantus-Network/qp-zk-circuits.git", rev = "080bc897108e4aed3e315ccd9229bbbbcdb1c9f2" }

[dev-dependencies]
tempfile = "3"

# Circuit generation is CPU-intensive; without this it takes ~10min instead of ~30s.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(frb_expand)']
